; EmuMD: this firmware's own C code built for the host and run in Hatari
; with an emulated Multi-device (emu/emumd, emu/README.md).
;
;   python3 tools/gen_scene.py --out build/generated/scene/bench_scene_assets.h
;   emu/emumd/tools/mdfw build
;   emu/emumd/tools/mdfw run [--headless --frames N --screenshot out.png]

[firmware]
name = md-chorensa
template = sidecartridge
uuid = 44444444-4444-4444-8444-444444444444

[sources]
files =
    rp/src/*.c
    rp/src/settings/settings.c
    emu/*.c

[compile]
shims =
    emu/shim
include =
    rp/src
    rp/src/include
    rp/src/settings
    build/generated/scene
defines =
    PICO_FLASH_ASSUME_CORE0_SAFE=1

[run]
sd = emu/sd
; TOS 1.62 (UK, 50 Hz), linked locally as emu/tos/tos162uk.img (gitignored;
; emu/README.md)
tos = emu/tos/tos162uk.img
machine = ste
hatari_args = --borders on
